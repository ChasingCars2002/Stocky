name: Update prices

on:
  schedule:
    # 22:30 UTC, weekdays — after the US market close (DST-safe enough; the job
    # is idempotent so an off-by-an-hour run does no harm).
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Ingest mode"
        type: choice
        options:
          - refresh
          - append
        default: refresh

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Fetch prices
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python ingest/fetch.py --mode "${{ github.event.inputs.mode || 'refresh' }}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.parquet web/public/data/prices.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update prices ($(date -u +%Y-%m-%d))"
            git push
          fi
